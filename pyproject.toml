[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "echora-kara"
version = "0.1.0"
description = "Word- and syllable-level lyrics alignment for karaoke, directly on the original song mix."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  # Model and alignment engine
  "numpy==2.5.2",
  "torch==2.13.0",
  "torchaudio==2.11.0",
  "transformers==5.15.1",
  "safetensors>=0.4",
  "muq==0.1.0",
  "librosa==0.11.0",
  "soundfile==0.13.1",
  # Lyric normalizer: romanised, pronunciation-aware labels for many scripts and languages.
  # phonemizer drives espeak-ng (system package, 1.51 or 1.52); both are GPL-3.0.
  "phonemizer==3.4.0",
  "nltk==3.9.1",
  "num2words==0.5.14",
  "pyphen==0.17.2",
  "fasttext-wheel==0.9.2",
  "pykakasi==2.3.0",
  "Janome==0.5.0",
  "jaconv==0.4.0",
  "pypinyin==0.55.0",
  "OpenCC==1.4.2",
  "ToJyutping==3.2.0",
  "pythainlp==5.4.0",
  "uroman==1.3.1.1",
]

[project.optional-dependencies]
data = ["scipy>=1.13"]
train = ["scipy>=1.13", "wandb"]
dev = ["pytest"]

[project.scripts]
echora-kara-align = "echora_kara.inference.cli:main"
echora-kara-train = "echora_kara.train.train:main"
echora-kara-build-manifest = "echora_kara.data.build_manifest:main"
echora-kara-filter-quality = "echora_kara.data.filter_label_quality:main"
echora-kara-vocal-activity = "echora_kara.data.vocal_activity:main"
echora-kara-convert-omniasr = "echora_kara.train.convert_omniasr:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"echora_kara.text" = ["dictionaries/SHA256SUMS"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "D1"]
ignore = ["E501", "E731", "E741", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]
